name: TPOS Windows build and authentication tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK version
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Tpos.sln

      - name: Build Release
        run: dotnet build Tpos.sln --configuration Release --no-restore

      - name: Run authentication and SQLite integration tests
        run: dotnet test tests/Tpos.Tests/Tpos.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tpos-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpos-windows-test-results
          path: TestResults/
          retention-days: 14
